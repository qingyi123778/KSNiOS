name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deb:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos 工具链
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 拉取 iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 -o /tmp/sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls -1 "$HOME/theos/sdks"

      - name: 编译
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1

      - name: 校验产物
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n1)
          echo "产物: $DEB"
          test -f "$DEB"
          dpkg-deb -c "$DEB" | tee /tmp/list.txt
          grep -q "DynamicLibraries/KSNiOS.dylib" /tmp/list.txt
          grep -q "KSNiOS.plist" /tmp/list.txt
          SIZE=$(stat -f%z "$DEB")
          echo "大小: $SIZE bytes"
          test "$SIZE" -gt 20000

      - uses: actions/upload-artifact@v4
        with:
          name: ksnios-deb
          path: packages/*.deb
          if-no-files-found: error
